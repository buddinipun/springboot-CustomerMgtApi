<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="fragments/navbar :: body"></div>

<div class="container mt-4">

    <h3>Search Customer by NIC</h3>

    <form method="get" th:action="@{/ui/customers/search}">

        <div class="mb-3">
            <label>NIC</label>
            <input type="text" name="nic" class="form-control" required>
        </div>

        <button class="btn btn-primary">Search</button>

    </form>

    <div th:if="${customer != null}" class="mt-4">

        <h5>Customer Details</h5>

        <p><b>Name:</b> <span th:text="${customer.firstName}"></span></p>
        <p><b>Email:</b> <span th:text="${customer.email}"></span></p>
        <p><b>Mobile:</b> <span th:text="${customer.mobile}"></span></p>

    </div>

</div>

</body>
</html>
