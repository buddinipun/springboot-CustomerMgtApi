<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Statistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="fragments/navbar :: body"></div>

<div class="container mt-4">

    <h3>Registration Statistics</h3>

    <form method="get" th:action="@{/ui/customers/stats}">

        <div class="row">

            <div class="col">
                <label>Start Date</label>
                <input type="date" name="startDate" class="form-control" required>
            </div>

            <div class="col">
                <label>End Date</label>
                <input type="date" name="endDate" class="form-control" required>
            </div>

        </div>

        <button class="btn btn-success mt-3">Get Stats</button>

    </form>

    <div th:if="${count != null}" class="mt-4">

        <h5>Total Registrations: <span th:text="${count}"></span></h5>

    </div>

</div>

</body>
</html>
